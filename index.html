<!DOCTYPE html>
<html>

<head>

    <title>MealMate Login</title>


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #faf7f7;

        }



        .login-page {


            width: 95%;

            height: 92vh;


            display: flex;


            justify-content: space-around;


            align-items: center;




            background:

                linear-gradient(rgba(250, 247, 247, 0.75),
                    rgba(250, 247, 247, 0.75)),


                url("logo.png.jpeg");



            background-size: 700px;


            background-repeat: no-repeat;


            background-position: center;



            border: 8px solid #7F9378;


            border-radius: 45px;


            box-shadow:
                0 0 20px #7F9378,
                inset 0 0 15px white;



            padding: 40px;


        }





        .quote {


            width: 50%;


            padding: 40px;


            color: #4B3730;


        }



        .quote h1 {


            font-size: 55px;


            line-height: 1.2;


        }




        .quote p {


            font-size: 24px;


            margin-top: 25px;


            color: #4B3730;

            font-weight: bold;


            line-height: 1.5;


        }






        .login-box {


            background: white;


            width: 390px;


            padding: 40px;


            border-radius: 25px;


            box-shadow: 0 0 15px grey;


            text-align: center;


            border: 3px solid #AD89B5;


        }




        .login-box h2 {


            color: #4B3730;


            margin-bottom: 25px;


        }





        input {


            width: 300px;


            padding: 13px;


            margin: 10px;


            border: 1px solid #ddd;


            border-radius: 10px;


        }





        button {


            background: #AD89B5;


            color: white;


            border: none;


            padding: 13px 40px;


            border-radius: 10px;


            font-size: 16px;


            cursor: pointer;


        }



        button:hover {


            background: #7F9378;


        }






        .google-btn {


            background: white;


            color: #4B3730;


            border: 1px solid #ddd;


            margin-top: 15px;


            width: 300px;


        }






        .signup-link {


            margin-top: 20px;


        }




        .signup-link a {


            color: #AD89B5;


            font-weight: bold;


            cursor: pointer;


        }





        .error-message {


            color: #D98686;


            font-size: 14px;


            margin-top: 10px;


            font-weight: bold;


            display: none;


        }




        #signupForm {


            display: none;


        }
    </style>


</head>





<body>



    <div class="login-page">





        <div class="quote">


            <h1>

                Share Food,<br>

                Share Hope ❤️

            </h1>




            <p>

                "Every meal shared is a step towards a hunger-free world."

            </p>



            <p>

                "Together we can make hunger disappear 🍲"

            </p>



        </div>








        <div class="login-box">





            <div id="loginForm">


                <h2>

                    Login to MealMate

                </h2>



                <input type="email" id="loginEmail" placeholder="Email ID">


                <input type="password" id="loginPassword" placeholder="Password">




                <button onclick="login()">

                    Login

                </button>




                <p id="loginError" class="error-message">

                    Please enter login details

                </p>




                <button class="google-btn" onclick="googleLogin()">


                    🌐 Continue with Google


                </button>




                <div class="signup-link">


                    New user?


                    <a onclick="showSignup()">

                        Create Account

                    </a>


                </div>


            </div>







            <div id="signupForm">


                <h2>

                    Create Account

                </h2>




                <input type="text" id="signupName" placeholder="Full Name">


                <input type="email" id="signupEmail" placeholder="Email ID">


                <input type="password" id="signupPassword" placeholder="Create Password">


                <input type="tel" id="signupPhone" placeholder="Phone Number">





                <button onclick="signup()">

                    Sign Up

                </button>




                <p id="signupError" class="error-message">

                    Please fill all signup details

                </p>






                <div class="signup-link">


                    Already have account?


                    <a onclick="showLogin()">

                        Login

                    </a>



                </div>



            </div>





        </div>





    </div>








    <script>


        function showSignup() {


            document.getElementById("loginForm").style.display = "none";


            document.getElementById("signupForm").style.display = "block";


        }




        function showLogin() {


            document.getElementById("signupForm").style.display = "none";


            document.getElementById("loginForm").style.display = "block";


        }





        function login() {


            let email = document.getElementById("loginEmail").value;


            let password = document.getElementById("loginPassword").value;



            if (email == "" || password == "") {


                document.getElementById("loginError").style.display = "block";


            }

            else {


                document.getElementById("loginError").style.display = "none";


                window.location.href = "mealmate.html";


            }



        }





        function signup() {



            let name = document.getElementById("signupName").value;


            let email = document.getElementById("signupEmail").value;


            let password = document.getElementById("signupPassword").value;


            let phone = document.getElementById("signupPhone").value;




            if (name == "" || email == "" || password == "" || phone == "") {


                document.getElementById("signupError").style.display = "block";


            }



            else {


                document.getElementById("signupError").style.display = "none";


                window.location.href = "mealmate.html";


            }



        }






        function googleLogin() {


            window.location.href = "mealmate.html";


        }



    </script>


</body>

</html>
